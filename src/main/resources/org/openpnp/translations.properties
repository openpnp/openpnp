BottomVisionSettingsConfigurationWizard.lblAllowVisionOffsets.text=Asymmetric?
BottomVisionSettingsConfigurationWizard.lblAllowVisionOffsets.toolTipText=<html>\r\nEnable if the part/package is asymmetric by design, i.e., if the contacts are offset<br/>\r\nrelative to the design center of the part/package, where the part is also picked.<br/>\r\nOnce a part/package is marked as asymmetric, vision offsets can be entered/detected<br/>\r\nto compensate for in bottom vision.<br/>\r\nNote, this should only be used for asymmetries that are <em>by design</em>, not to compensate<br/>\r\nfor some repeatable placement error offsets. If you have repeatable placement error offsets,<br/>\r\ndouble-check if the E-CAD package design is centered correctly, redo camera and nozzle offsets<br/>\r\ncalibration, and/or investigate board fiducial checks.\r\n</html>
