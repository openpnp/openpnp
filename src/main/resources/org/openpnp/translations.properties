PackageCompositingWizard.AllowInsideCornerLabel.text=Allow inside corner?
PackageCompositingWizard.AllowInsideCornerLabel.toolTipText=<html>\n<p>Allows the inclusion of corners facing inside, towards the center of the part. <br/>\nThis can be used to align parts that are still too large, i.e., where the <strong>Roaming Radius</strong><br/>\nof the camera is too small. It typically requires large, well-spaced pads.</p>\n<br/>\n<p>Example\: SMD power rectifiers.</p>\n</html>
PackageCompositingWizard.Border.title=Compositing
PackageCompositingWizard.ComputeCompositing.Name=Compute
PackageCompositingWizard.ComputeCompositing.ShortDescription=Recompute the vision compositing.
PackageCompositingWizard.Error.text=Error\: 
PackageCompositingWizard.ExtraShotsLabel.text=Extra Shots
PackageCompositingWizard.ExtraShotsLabel.toolTipText=<html>\n<p>Vision Compositing determines the optimal minimum set of required shot to determine<br/>\nthe part position and angle. On top of that, it suggests extra shots, that can be used to <br/>\nimprove positional and angular accuracy. </p>\n<br/>\n<p>Example\: a square part can be determined in two diagonal corner shots. The opposite two<br/>\ncorners of the square are proposed as extra shots.</p>\n<br/>\n<p><strong>Extra Shots</strong> indicates how man of these extra shots should be used. \n</html>
PackageCompositingWizard.MaxPickToleranceLabel.text=Max. Pick Tolerance
PackageCompositingWizard.MaxPickToleranceLabel.toolTipText=<html>\n<p>If zero, the <strong>Max. Pick Tolerance</strong> on the nozzle tip is taken.</p>\n<br/>\n<p>If non-zero, this <strong>Max. Pick Tolerance</strong> overrides it for this package.</p>\n<br/>\n<p>In both cases, the <strong>Max. Pick Tolerance</strong> must cover linear <br/>\noffsets of the picked part on the nozzle, and corner offsets <br/>\ncaused by rotational offsets, as well as combinations of the two.</p>\n</html>
PackageCompositingWizard.MethodLabel.text=Method
PackageCompositingWizard.MethodLabel.toolTipText=<html>\n<p>Compositing method\:</p>\n<ul>\n<li><strong>None\:</strong> no compositing is performed.</li>\n<li><strong>Restricted\:</strong> compositing is only performed, when the <br/>\nfootprint size is too large, or if it is asymmetric.</li>\n<li><strong>Automatic\:</strong> compositing is always performed. It can still <br/>\nresult in a one-shot solution, if the corners are all convex <br/>\nand symmetric.</li>\n<li><strong>SingleCorner\:</strong> compositing is always performed. Each <br/>\ncorner is individually shot. Reduces parallax errors, as <br/>\neach corner is centered in the camera.</li>\n</ul>\n</html>\n\n
PackageCompositingWizard.MinAngleLeverageLabel.text=Min. Angle Leverage
PackageCompositingWizard.MinAngleLeverageLabel.toolTipText=<html>\n<p>Minimum leverage required to derive angular information from two corners.</p>\n<br/>\n<p><strong>Min. Angle Leverage</strong> is given <em>relative</em> to the footprint width and height<br/>\n(the lesser of the two).</p>\n<br/>\n<p>Example\: setting 0.5 requires two corners to span at least half the part dimension<br/>\nto provide angular information.</p>\n</html>
