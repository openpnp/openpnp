VisionSolutions.ExtendedDescription.PrimaryFiducial=<html><p>Camera calibration can be performed automatically by looking at fiducials while moving the camera around in a certain pattern. This solution determines the X, Y position of the primary fiducial and it performs preliminary camera calibration.</p><br/><p>Instructions for how to create and position the primary fiducial must be obtained in the OpenPnP Wiki. <strong>There are very important rules that must be observed\!</strong> Press the blue Info button (below) to open the Wiki.</p><br/><p>Once you have prepared the calibration primary fiducial you can capture its position in X, Y.</p><br/><p>Jog camera {0} over the privary fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to capture the position. The camera will perform a small calibration movement pattern</p></html>
