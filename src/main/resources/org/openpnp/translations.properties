# NozzleTipSolutions
NozzleTipSolutions.Issue.ManualTipChangeLocation=Set the manual nozzle tip change location for {0}.
NozzleTipSolutions.Solution.ManualTipChangeLocation=Jog {0} to the manual nozzle tip changing location, then press Accept.
NozzleTipSolutions.ExtendedDescription.ManualTipChangeLocation=<html><p>Jog {0} to a suitable location where you can manually exchange the nozzle tips.</p><br/><p>Even if you (plan to) use an automatic nozzle tip changer, it is useful to have this location definied, in case you want to disable automatic changing temporarily.</p><br/><p>Often it is best to move Z all the way up so the tip is well reachable. On some head designs the uppermost Z position is blocked by a limiter, so it is the best position to apply the necessary force when inserting the nozzle tip.</p><br/><p>Note for experts: the captured location will be automatically adjusted if you change the nozzle head offsets later.</p><br/><p>Press <strong>Accept</strong> to store the location.</p><br/></html>
NozzleTipSolutions.Issue.NoCompatibleNozzle=Nozzle tip {0} has no compatible nozzle.
NozzleTipSolutions.Solution.NoCompatibleNozzle=Go to the nozzle(s) and enable the Compatible switches where appropriate.
NozzleTipSolutions.Issue.EnableCalibration=Enable nozzle tip {0} calibration.
NozzleTipSolutions.Solution.EnableCalibration=Enable run-out, background and offset calibration for nozzle tip {0}.
NozzleTipSolutions.ExtendedDescription.EnableCalibration=<html><p>It is recommended to enable nozzle tip calibration for run-out and precision camera offsets. For more information, press the blue Info button (below) to open the Wiki.</p><br/>{0}<p>Press the <strong>Center Nozzle</strong> button (below) to center nozzle {1} over the camera {2}.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the wanted contour. Zoom the camera using the scroll-wheel. Make sure to target a circular edge that can be detected consistently even when seen from the side. This means it has to be a rather sharp-angled edge. To eliminate nozzle and camera tilt errors, choose a contour that is lowest in Z on the nozzle tip. Typically, the air bore contour is targeted.</p><br/><p>Then press Accept to enable and perform the nozzle tip calibration.</p></html>
NozzleTipSolutions.ExtendedDescription.EnableCalibration.LoadTip=<p>Load nozzle tip {0} to nozzle {1}.</p><br/>
NozzleTipSolutions.ExtendedDescription.EnableCalibration.TipLoaded=<p>Nozzle tip {0} is already loaded on nozzle {1}.</p><br/>
NozzleTipSolutions.Property.CenterNozzle=Center nozzle {0} over camera {1}
NozzleTipSolutions.Action.CenterNozzle=Center Nozzle
NozzleTipSolutions.Exception.TipNotLoaded=The nozzle tip {0} is not loaded on nozzle {1}.
NozzleTipSolutions.Issue.LargePickTolerance=Nozzle tip {0} has a large Max. Pick Tolerance of {1}.
NozzleTipSolutions.Solution.LargePickTolerance=Set the Max. Pick Tolerance to the actual pick errors you expect. Press the blue info button (below) for more information.
NozzleTipSolutions.Issue.InvalidMinPartDiameter=Nozzle tip {0} has an invalid Min. Part Diameter of {1}.
NozzleTipSolutions.Solution.InvalidMinPartDiameter=Make the Min. Part Diameter at least as big as the nozzle tip air bore plus two times the Max. Pick Tolerance of {0}. Press the blue info button (below) for more information.
NozzleTipSolutions.Issue.MaxMinPartDiameter=Nozzle tip {0} has a Max. Part Diameter that is not larger than the Min. Part Diameter.
NozzleTipSolutions.Solution.MaxMinPartDiameter=Make sure the Max. Part Diameter is larger than the Min. Part Diameter. Press the blue info button (below) for more information.
NozzleTipSolutions.Issue.BackgroundCalibration=Set background calibration method for {0}.
NozzleTipSolutions.Solution.BackgroundCalibration=Depending on the type of nozzle tip or shade, select the proper background calibration.
NozzleTipSolutions.ExtendedDescription.BackgroundCalibration=<html><p>Select the proper background calibration.</p><br/><p><strong color="red">CAUTION</strong>: Nozzle {0} will move over camera {1} and perform a new nozzle tip calibration calibration, including the enabled background calibration. Any problems will be indicated with purple highlights.</p><br/><p>When ready, press Accept.</p>{2}</html>
NozzleTipSolutions.ExtendedDescription.BackgroundCalibration.Results=<br/><h4>Results</h4><p style="max-width: 40em">{0}</p><br/><p>More information on the Calibration tab of nozzle tip {1}.</p>
NozzleTipSolutions.Choice.BrightnessAndKeyColor=<html><h3>Brighness and Key-Color</h3><p>The nozzle tip and/or background (shade) is color-keyed so computer vision can robustly distinguish background pixels from foreground pixels ("green-screening"). Use for green Juki style nozzles.</p></html>
NozzleTipSolutions.Choice.Brightness=<html><h3>Brightness</h3><p>The background is just dark, the foreground is distinguished by brighness only.</p><br/></html>
NozzleTipSolutions.Property.LoadNozzleTip=Load nozzle tip {0} on {1}
NozzleTipSolutions.Action.LoadNozzleTip=Load Nozzle Tip {0}
NozzleTipSolutions.Exception.TipAlreadyLoaded=The nozzle tip {0} is already loaded on nozzle {1}.
# KinematicSolutions
KinematicSolutions.Issue.MachineMustBeHomed=To continue, the machine must be enabled and homed.
KinematicSolutions.Solution.MachineMustBeHomed=Home the machine now.
KinematicSolutions.ExtendedDescription.MachineMustBeHomed=<html><p>You must be sure that your machine supports the homing command with the proper axis end-switches wired and configured.</p><br/><p>Press <strong>Accept</strong> to perform the homing.</p><br/><p>Afterwards, press <strong>Find Issues & Solutions</strong> again.</p></html>
KinematicSolutions.Issue.DynamicSafeZ=Dynamic Safe Z for {0}.
KinematicSolutions.Solution.DynamicSafeZ=Decide whether {0} has dynamic Safe Z or not.
KinematicSolutions.Choice.DynamicSafeZ=<html><h3>Dynamic Safe Z</h3><p>If a part is on the nozzle, the nozzle is lifted to Safe Z <strong>+</strong> part height.</p><br/><p>Safe Z must only account for the tallest obstacle.</p><br/><p>This will result in faster, more optimized machine motion.</p><br/><p><strong>Recommended.</strong>.</p><br/></html>
KinematicSolutions.Choice.FixedSafeZ=<html><h3>Fixed Safe Z</h3><p>Safe Z is always at a fixed level.</p><br/><p>Safe Z must account for <em>both</em> the tallest obstacle <em>and</em> the tallest part on the nozzle.</p><br/><p>This will result in slower, less optimized machine motion.</p></html>
KinematicSolutions.Issue.InvalidSafeZZone=Invalid Safe Z Zone on {0}.
KinematicSolutions.Solution.InvalidSafeZZone=The Safe Z Zone of {0} is invalid (lower limit > higher limit). Start fresh configuration.
KinematicSolutions.Issue.UnconventionalZ=Unconventional Z Axis on {0}.
KinematicSolutions.Solution.UnconventionalZ=The Safe Z of {0} is positive, which is unconventional. OpenPnp typically uses Z coordinates that have Z=0 when the nozzle is retracted, with the PCB surface in the negative Z range. Please read the Wiki to understand the implications of not following this convention.
KinematicSolutions.Issue.SetSafeZ=Set Safe Z of {0}.
KinematicSolutions.Solution.SetSafeZ=Jog {0} over the tallest obstacle and capture.
KinematicSolutions.ExtendedDescription.SetSafeZ=<html><p>Jog {0} over the tallest obstacle on your machine, including the the tallest parts that may be placed on the PCB.</p><br/><p>Then lower it down so it still has sufficient clearance{1}.</p><br/><p>Then press Accept to capture the Safe Z.</p>{2}</html>
KinematicSolutions.ExtendedDescription.SetSafeZ.PartClearance= even with the tallest part on the nozzle
KinematicSolutions.ExtendedDescription.SetSafeZ.MultiNozzle=<br/><p>Note: optimizing Safe Z will improve your overall motion speed, however your nozzles may appear unbalanced and they will sometimes see-saw during motion. If you rather prefer a strictly symmetric appearance, you might want to dismiss this solution, and setup Safe Z manually.</p>
KinematicSolutions.Issue.DeprecatedCamTransform=Deprecated cam transform on axis {0} detected.
KinematicSolutions.Solution.DeprecatedCamTransform=Remove cam transform axis {0} {1}and compensate in nozzle offset.
KinematicSolutions.ExtendedDescription.DeprecatedCamTransform=<html><p>The cam transform on axis {0} with non-zero {1} is deprecated.</p><br/><p><strong color="red">CAUTION:</strong> These offsets will create problems when Issues & Solutions wants to (re-)reference the Z coordinate system later. Failing to accept this solution may ultimately lead to a dead end in the machine setup process.</p><br/><p>Press <strong>Accept</strong> to remove the {2}as recommended.{3}</p></html>
KinematicSolutions.ExtendedDescription.DeprecatedCamTransform.Note=</p><br/><p><strong>Note:</strong> this change will be compensated in the Z head offset of {0}, so that Z coordinates captured before effectively remain the same.
KinematicSolutions.Issue.SoftLimit=Set the {0} soft limit of {1}.
KinematicSolutions.Solution.SoftLimit=Move axis {0} to the {1} soft limit and capture.
KinematicSolutions.Choice.SoftLimit.Low=low side
KinematicSolutions.Choice.SoftLimit.High=high side
KinematicSolutions.ExtendedDescription.SoftLimit=<html><p>Move axis {0} to the {1} soft limit.</p><br/><p>Jog {2} of {3} {4} to do so.</p><br/><p>If the axis has a limit switch, use a position close to it but still safe to not trigger the switch by accident.</p><br/><p>Then press Accept to capture the lower soft limit.</p></html>
KinematicSolutions.Issue.SafeZZoneViolation=Nozzle {0} with tip {1} Safe Z Zone violation.
KinematicSolutions.Solution.SafeZZoneViolation=With dynamic safe Z, the Max. Part Height of each compatible nozzle tip must be smaller than the axis {0} Safe Z Zone.
KinematicSolutions.ExtendedDescription.SafeZZoneViolation=<html><p>With <strong>Dynamic Safe Z</strong> enabled, the nozzle needs a head-room, the so-called Safe Z Zone to lift the nozzle higher with taller parts. The maximum expected part height is specified on the nozzle tip <strong>Max. Part Height</strong>.</p><br/><p>Nozzle {0} with compatible tip {1} has a <strong>Max. Part Height</strong> of {2} which is larger than the Safe Z Zone of {3}. Note, the safe Z Zone is configured on the {4} axis to reach from {5} to {6} in (untransformed) coordinates.</p><br/><p>Please either enlarge the Safe Z Zone, by reducing the nozzle {0} Z clearance, or reduce the <strong>Max. Part Height</strong> on nozzle tip {1}.</p><br/><p>Reducing Z clearance is best done by revisiting the Safe Z solution for nozzle {0}. Enable the <strong>Include Solved?</strong> checkbox at the top, then reopen the "Set Safe Z of {0}" solution and redo it.</p></html>
KinematicSolutions.Issue.SafeZZoneViolationCombined=Nozzle {0} with tip {1} and nozzle {2} with tip {3} potential Safe Z Zone violation.
KinematicSolutions.Solution.SafeZZoneViolationCombined=With dynamic safe Z, the combined Max. Part Heights of compatible nozzle tips must be smaller than the axis {0} Safe Z Zone.
