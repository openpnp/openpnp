VisionSolutions.ExtendedDescription.VisualHoming=<html><p>Mount a permanent fiducial to your machine table. Choose a mounting point that is mechanically coupled to the most important parts of your machine table. Make sure it is very unlikely you will ever need to change this new frame of reference. The fiducial must be at the same Z level as the PCB surface. More information is avaible online, please press the blue Info button (below).</p><br/><p>Home the machine by means of your controller/manually. The controller must presently work in the wanted coordinate system.</p><br/><p>Jog camera {0} over the fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to detect the precise position of the fiducial and set it up for visual homing.</p><br/><p>Note\: This will not change your present machine coordinate system, but rather pin it down to the fiducial. If the mechanics were to change slightly in the future (e.g. a homing end-switch slightly moved), the homing fiducial will still be able to precisely preserve the frame of reference in X and Y.</p></html>
