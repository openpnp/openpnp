NozzleTipSolutions.ExtendedDescription.ManualTipChangeLocation=<html><p>Jog {0} to a suitable location where you can manually exchange the nozzle tips.</p><br/><p>Even if you (plan to) use an automatic nozzle tip changer, it is useful to have this location definied, in case you want to disable automatic changing temporarily.</p><br/><p>Often it is best to move Z all the way up so the tip is well reachable. On some head designs the uppermost Z position is blocked by a limiter, so it is the best position to apply the necessary force when inserting the nozzle tip.</p><br/><p>Note for experts\: the captured location will be automatically adjusted if you change the nozzle head offsets later.</p><br/><p>Press <strong>Accept</strong> to store the location.</p><br/></html>
