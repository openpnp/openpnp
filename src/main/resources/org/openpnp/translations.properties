CalibrationSolutions.ExtendedDescription.BacklashCalibration=<html><p>Backlash compensation is used to avoid the effects of any looseness or play in the mechanical linkages of machine axes. More information can be found in the Wiki (press the blue Info button below).</p><br/><p>Set the acceptable <strong>Tolerance ±</strong> as high as possible to allow for a more efficient backlash compensation method, avoiding extra moves and direction changes.</p><br/><p><strong color\="red">CAUTION 1</strong>\: The camera {0} will move over the primary fiducial and then perform a calibration motion pattern, moving the axis {1} over its full soft-limit range.</p><br/><p><strong color\="red">CAUTION 2</strong>\: The machine will also perform a visual homing cycle, once the new backlash compensation method is established. This is done to recalibrate the coordinate system that might be affected by the new method.</p><br/><p>When ready, press Accept.</p>{2}</html>
