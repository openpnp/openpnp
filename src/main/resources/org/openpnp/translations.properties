KinematicSolutions.ExtendedDescription.SafeZZoneViolationCombined=<html><p>With <strong>Dynamic Safe Z</strong> enabled, the nozzles need a head-room, the so-called Safe Z Zone to lift the nozzles higher with taller parts. On nozzles with shared Z axes the part heights compete for the same head-room. The maximum expected part height is specified on the nozzle tip <strong>Max. Part Height</strong>.</p><br/><p>Nozzle {0} with compatible tip {1} has a <strong>Max. Part Height</strong> of {2}, furthermore, nozzle {3} with compatible tip {4} has a largest <strong>Max. Part Height</strong> of {5}, which in combination (and after transformation) is larger than the Safe Z Zone of {6}. Note, the safe Z Zone is configured on the {7} axis to reach from {8} to {9} in (untransformed) coordinates.</p><br/><p>Please either enlarge the Safe Z Zone, by reducing the nozzle {0} and {3} Z clearances, or reduce the <strong>Max. Part Height</strong> on nozzle tips {1} and {4}.</p><br/><p>Reducing Z clearances is best done by revisiting the Safe Z solutions for nozzles {0} and {3}. Enable the <strong>Include Solved?</strong> checkbox at the top, then reopen the "Set Safe Z of {10}" solution and redo it.</p></html>
