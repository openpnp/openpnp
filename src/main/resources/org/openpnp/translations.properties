CalibrationSolutions.ExtendedDescription.NozzleOffsetCalibration=<html><p>To calibrate precision camera �? nozzle offsets, we let the nozzle pick, rotate and place a small test object and then measure the resulting offsets using the camera.</p><br/><p>Instructions about suitable test objects etc. must be obtained in the OpenPnP Wiki. Press the blue Info button (below) to open the Wiki.</p><br/><p>Place the calibration test object onto the calibration primary fiducial.</p><br/><p>Jog camera {0} over the test object. Target it with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the test object contour. Zoom the camera using the scroll-wheel.</p><br/><p><strong color\="red">CAUTION</strong> The nozzle {1} will move to the test object and perform the calibration pick & place pattern. Make sure to load the right nozzle tip and ready the vacuum system.</p><br/><p>When ready, press Accept.</p>{2}</html>
