ReferenceNozzleTipToolChangerWizard.ChangerPanel.FirstLocationLabel.toolTipText=<html>First location in a nozzle tip loading motion sequence.<br/>\nThis is the first way-point when loading the nozzle tip and the<br/>\nlast way-point when unloading it.\n</hml>
ReferenceNozzleTipToolChangerWizard.ChangerPanel.LastLocationLabel.text=Last Location
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post1ActuatorLabel.text=Post 1 Actuator
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post2ActuatorLabel.text=Post 2 Actuator
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post3ActuatorLabel.text=Post 3 Actuator
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SecondLocationLabel.text=Second Location
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SpeedLabel.text=Speed
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ThirdLocationLabel.text=Third Location
ReferenceNozzleTipToolChangerWizard.ChangerPanel.TouchLocationLabel.text=Touch Location
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.text=Auto Z Calibration
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.toolTipText=<html>\nCalibrate the nozzle/nozzle tip Z by probing against the <strong>Touch Location</strong> surface.<br/>\nZ calibration can be triggered manually using the <strong>Calibrate now</strong> button or automatically\:<br/>\n<ul>\n<li><strong>Manual\:</strong> No automatic Z calibration is done. Manual calibration is stored<br/>\npermanently in the configuration and remains valid through machine homing.</li>\n<li><strong>MachineHome\:</strong> Automatic Z calibration is performed when the machine is homed.<br/>\nThe nozzle Z calibration is reused when another Nozzle Tip is loaded.</li>\n<li><strong>NozzleTipChange\:</strong> Automatic Z calibration is done whenever this Nozzle Tip<br/>\nis changed or when the machine is homed and this Nozzle Tip is currently loaded.</li>\n</ul>\nNote, you can use a stand-in Nozzle Tip named "unloaded" to perform Z calibration of the naked nozzle. \n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.text=Behavior
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.toolTipText=<html>\nOne nozzle tip can become the <strong>Template</strong> for others to be cloned from.<br/>\nOpenPnP will automatically translate Locations relative to the First Location.<br/>\nIf individual nozzle tips are special, mark them as <strong>Locked</strong>to prevent cloning.\n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.Border.title=Cloning Settings
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.text=Template
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.toolTipText=Mark this nozzle tip as the template that can be cloned to and from the other nozzle tips.
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.text=Clones from Template
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.toolTipText=This nozzle tip can clone its settings from the nozzle tip marked as the <strong>Template</strong>.
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LocationsLabel.text=Locations?
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.text=Locked
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.toolTipText=<html>This nozzle tip is locked against cloning.<br/>Note, its touch location Z can still be calibrated against the template nozzle tip reference. </html>
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.VisionCalibrationLabel.text=Vision Calibration?
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ZCalibrationLabel.text=Z Calibration?
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.text=Adjust Z
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.toolTipText=<html>\nAdjust the Z coordinate of the Vision Location by this offset. Set it to the Z distance between <br/>\nthe template subject that you are detecting with Vision Calibration, e.g. the visible surface of <br/>\nthe changer slot, and the (imaginary) underside of the nozzle tip when at that location. Positive <br/>\nadjustment when the nozzle tip is below, negative when it is above that surface.<br/> \nThe setting can overcome scaling errors in the camera view, especially when things are much <br/>\ncloser to the camera than usual.<br/>\n<strong>3D Units per Pixel must be configured on the camera.</strong> \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.Border.title=Vision Calibration
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.CalibrationTriggerLabel.text=Calibration Trigger
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.LastScoreLabel.text=Last Score
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MaxPassesLabel.text=Max. Passes
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.text=Minimum Score
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.toolTipText=<html>\nWhen the template images are matched against the camera image, a score is computed<br/>\nindicating the quality of the match. If the obtained score is smaller than the Minimum Score<br/>\ngiven here, the calibration fails. This should stop the machine from atempting a nozzle tip <br/>\nchange, when the position is wrong. \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateEmptyLabel.text=Template Empty
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.text=Template Height
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.toolTipText=<html>\nTemplate image height (Y). The template is centered around the selected Vision Location.<br/>\nChoose dimensions as small as possible, but the templates should include tell-tale horizontal and vertical<br/>\nedges. Furthermore, the nozzle tip should be visible when it occupies the changer slot.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateOccupiedLabel.text=Template Occupied
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.text=Template Width
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.toolTipText=<html>\nTemplate image width (X). The template is centered around the selected Vision Location.<br/>\nChoose dimensions as small as possible, but the templates should include tell-tale horizontal and vertical<br/>\nedges. Furthermore, the nozzle tip should be visible when it occupies the changer slot.\n</html>
