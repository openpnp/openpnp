ReferenceNozzleTipToolChangerWizard.Action.CalibrateZ.Description=<html>Calibrate the nozzle/nozzle tip Z by contact-probing against the <strong>Touch Location</strong> surface.</html>
ReferenceNozzleTipToolChangerWizard.Action.CaptureTemplateImageEmpty=Capture
