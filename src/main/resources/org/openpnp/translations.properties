ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.toolTipText=<html>It is important that OpenPnP understands whether an Axis is linear or rotational in <br/>\r\nthe controller. <br/>\r\n<br/>\r\nMost of the times this is already determined by the Axis Type, i.e. X, Y, Z are linear <br/>\r\nand Rotation is rotational. But sometimes you may run out of proper axes on the <br/>\r\ncontroller and then have to use a linear controller axis for a rotational OpenPnP axis <br/>\r\nor vice versa.<br/>\r\n<br/>\r\nIf you cannot configure your controller to switch this meaning, it is important to enable <br/>\r\nthe Switch Linear �? Rotational checkbox.<br/>\r\n<br/>\r\nThis is relevant in computing proper limits for feed-rate, acceleration and jerk in mixed<br/>\r\naxes moves, as only the motion of linear axes is taken into consideration for the limts in <br/>\r\nstandard G-Code.<br/>\r\n</html>
