# KinematicSolutions
KinematicSolutions.ExtendedDescription.SafeZZoneViolationCombined=<html><p>With <strong>Dynamic Safe Z</strong> enabled, the nozzles need a head-room, the so-called Safe Z Zone to lift the nozzles higher with taller parts. On nozzles with shared Z axes the part heights compete for the same head-room. The maximum expected part height is specified on the nozzle tip <strong>Max. Part Height</strong>.</p><br/><p>Nozzle {0} with compatible tip {1} has a <strong>Max. Part Height</strong> of {2}, furthermore, nozzle {3} with compatible tip {4} has a largest <strong>Max. Part Height</strong> of {5}, which in combination (and after transformation) is larger than the Safe Z Zone of {6}. Note, the safe Z Zone is configured on the {7} axis to reach from {8} to {9} in (untransformed) coordinates.</p><br/><p>Please either enlarge the Safe Z Zone, by reducing the nozzle {0} and {3} Z clearances, or reduce the <strong>Max. Part Height</strong> on nozzle tips {1} and {4}.</p><br/><p>Reducing Z clearances is best done by revisiting the Safe Z solutions for nozzles {0} and {3}. Enable the <strong>Include Solved?</strong> checkbox at the top, then reopen the "Set Safe Z of {10}" solution and redo it.</p></html>
KinematicSolutions.Choice.DeprecatedCamTransform.WheelRadius=wheel radius, 
KinematicSolutions.Choice.DeprecatedCamTransform.WheelGap=wheel gap, 
# VisionSolutions
VisionSolutions.ExtendedDescription.PrimaryFiducial=<html><p>Camera calibration can be performed automatically by looking at fiducials while moving the camera around in a certain pattern. This solution determines the X, Y position of the primary fiducial and it performs preliminary camera calibration.</p><br/><p>Instructions for how to create and position the primary fiducial must be obtained in the OpenPnP Wiki. <strong>There are very important rules that must be observed!</strong> Press the blue Info button (below) to open the Wiki.</p><br/><p>Once you have prepared the calibration primary fiducial you can capture its position in X, Y.</p><br/><p>Jog camera {0} over the privary fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to capture the position. The camera will perform a small calibration movement pattern</p></html>
VisionSolutions.ExtendedDescription.SecondaryFiducial=<html><p>Camera calibration also requires looking at a secondary fiducial at different Z level. This will provide the calibration algorithm with the needed 3D/spacial information to determine the true focal length of the lens and the optical position of the camera in space.</p><br/><p>Instructions for how to create and position the secondary fiducial must be obtained in the OpenPnP Wiki. There are very important rules that must be observed, so don't miss it! Press the blue Info button (below) to open the Wiki.</p><br/><p>Once you have prepared the calibration secondary fiducial you can capture its position in X, Y.</p><br/><p>Jog camera {0} over the secondary fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to capture the position.</p></html>
VisionSolutions.ExtendedDescription.CameraHeadOffsets=<html><p>Once the calibration primary fiducial is captured you can use it to capture the camera head offsets (first approximation).</p><br/><p>Jog camera {0} over the primary fiducial. Target it with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to capture the offsets. The camera will perform a small calibration movement </html>
VisionSolutions.ExtendedDescription.UpLookingCamera=<html><p>Up-looking camera calibration can be performed automatically by looking at a nozzle tip while moving the nozzle around in a certain pattern. This solution determines the X, Y position of the camera and it performs preliminary camera calibration.</p><br/><p>Load nozzle {0} with the smallest nozzle tip that you can reliably detect (it may take some trial and error).</p><br/><p>Jog nozzle {0} over the camera {1}. Target it with the cross-hairs.</p><br/><p>Jog the nozzle tip point down in Z so it is in focus. This should be more or less on the same Z level as the PCB surface. If not, consider adjusting the camera focus to make it so.</p><br/><p>If enabled, auto-focus will be used to detect the precise Z location.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the wanted contour. Zoom the camera using the scroll-wheel.</p><br/><p>Make sure to target a circular edge that can be detected consistently even when seen from the side. This means it has to be a rather sharp-angled edge. Typically, the air bore contour is targeted.</p><br/><p>Then press Accept to capture the camera position.</p></html>
VisionSolutions.ExtendedDescription.NozzleFiducialOffsets=<html><p>Once the calibration {0} fiducial is captured in X, Y you can use it to capture the nozzle head offsets (first approximation).</p><br/>{1}{2}<p>Jog nozzle {3} over the {0} fiducial. Lower the nozzle tip down until it touches the fiducial.</p><br/><p><strong style="color:red;">CAUTION:</strong> this is a very important Z coordinate, please capture it with care.</p><br/><p>Then press Accept to capture the nozzle head offsets.</p></html>
VisionSolutions.ExtendedDescription.NozzleFiducialOffsets.CaptureZ=<p>This will also capture the calibration {0} fiducial Z coordinate.</p><br/>
VisionSolutions.ExtendedDescription.NozzleFiducialOffsets.EqualizeZ=<p>This will also equalize Z of nozzle {0} to Z of the default nozzle {1}.</p><br/>
VisionSolutions.ExtendedDescription.NozzleFiducialOffsets.NonZeroZWarning=<p><strong color="red">CAUTION:</strong> A non-zero head offsets Z has been detected on default nozzle {0}. Accepting this solution will reset it to zero, creating the new reference in Z. This will change the meaning of Z coordinates that have already been captured. Do not accept this solution, unless you are confident this is OK. In the worst case, this may lead to machine collisions! <strong color="red">You have been warned!</strong></p><br/>
VisionSolutions.ExtendedDescription.VisualHoming=<html><p>Mount a permanent fiducial to your machine table. Choose a mounting point that is mechanically coupled to the most important parts of your machine table. Make sure it is very unlikely you will ever need to change this new frame of reference. The fiducial must be at the same Z level as the PCB surface. More information is avaible online, please press the blue Info button (below).</p><br/><p>Home the machine by means of your controller/manually. The controller must presently work in the wanted coordinate system.</p><br/><p>Jog camera {0} over the fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to detect the precise position of the fiducial and set it up for visual homing.</p><br/><p>Note: This will not change your present machine coordinate system, but rather pin it down to the fiducial. If the mechanics were to change slightly in the future (e.g. a homing end-switch slightly moved), the homing fiducial will still be able to precisely preserve the frame of reference in X and Y.</p></html>
