GcodeDriverSolutions.Choice.DetectFirmware=<html><h3>Detect the firmware automatically</h3><p>The M115 command must be supported by the firmware. Make sure the controller is connected to the computer and accept the solution to perform the detection.</p><br/><p>This might take a while!</p><br/><p>If the firmware is known by OpenPnP, it will be able to automatically generate G-code configuration for you.</html>
GcodeDriverSolutions.Choice.AssumeGeneric=<html><h3>Assume a generic G-code controller</h3><p>When the M115 command is not supported by your controller you can let OpenPnP propose a generic G-code configuration.</p><br/><p>You will likely need to hand-tune the G-code configuration to work with your controller.</html>
