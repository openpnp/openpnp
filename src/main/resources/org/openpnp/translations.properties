KinematicSolutions.ExtendedDescription.SafeZZoneViolation=<html><p>With <strong>Dynamic Safe Z</strong> enabled, the nozzle needs a head-room, the so-called Safe Z Zone to lift the nozzle higher with taller parts. The maximum expected part height is specified on the nozzle tip <strong>Max. Part Height</strong>.</p><br/><p>Nozzle {0} with compatible tip {1} has a <strong>Max. Part Height</strong> of {2} which is larger than the Safe Z Zone of {3}. Note, the safe Z Zone is configured on the {4} axis to reach from {5} to {6} in (untransformed) coordinates.</p><br/><p>Please either enlarge the Safe Z Zone, by reducing the nozzle {0} Z clearance, or reduce the <strong>Max. Part Height</strong> on nozzle tip {1}.</p><br/><p>Reducing Z clearance is best done by revisiting the Safe Z solution for nozzle {0}. Enable the <strong>Include Solved?</strong> checkbox at the top, then reopen the "Set Safe Z of {0}" solution and redo it.</p></html>
