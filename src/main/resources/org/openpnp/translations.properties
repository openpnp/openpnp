CameraSolutions.ExtendedDescription.AdaptiveSettling=<html><p>For precision in computer vision it is very important that the camera image has settled down after the machine has moved the camera or the subject. Some cameras exhibit a slight lag, where the frames might still show the camera in motion. Motion might also cause vibration that must abate sufficently before computer vision is performed.</p><br/><p>The simple solution is just to wait for a fixed amount of time. However, this is wasteful if there was no motion in the first place. Using an adaptive settling method can reduce the wait time in these cases, i.e. one does not need to set a large worst case settle wait time.</p><br/>{0}<p>When ready, press Accept.</p>{1}</html>
