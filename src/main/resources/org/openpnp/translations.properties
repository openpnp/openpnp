# CameraSolutions
CameraSolutions.Issue.HighPreviewFps=A high Preview FPS value might create undue CPU load.
CameraSolutions.Solution.HighPreviewFps=Set to 5 FPS.
CameraSolutions.Issue.SuspendPreview.Switcher=For a SwitcherCamera it is mandatory to suspend camera preview during machine tasks / Jobs.
CameraSolutions.Issue.SuspendPreview.Recommended=It is recommended to suspend camera preview during machine tasks / Jobs.
CameraSolutions.Solution.SuspendPreview=Enable Suspend during tasks.
CameraSolutions.Issue.AutoCameraView=In single camera preview OpenPnP can automatically switch the camera for you.
CameraSolutions.Solution.AutoCameraView=Enable Auto Camera View.
CameraSolutions.Issue.RenderingQuality=The preview rendering quality can be improved.
CameraSolutions.Solution.RenderingQuality=Set to Rendering Quality to High (right click the Camera View to see other options).
CameraSolutions.Issue.AdaptiveSettling=Use an adaptive camera settling method.
CameraSolutions.Solution.AdaptiveSettling=Set a suitable camera settling method automatically.
CameraSolutions.ExtendedDescription.AdaptiveSettling=<html><p>For precision in computer vision it is very important that the camera image has settled down after the machine has moved the camera or the subject. Some cameras exhibit a slight lag, where the frames might still show the camera in motion. Motion might also cause vibration that must abate sufficently before computer vision is performed.</p><br/><p>The simple solution is just to wait for a fixed amount of time. However, this is wasteful if there was no motion in the first place. Using an adaptive settling method can reduce the wait time in these cases, i.e. one does not need to set a large worst case settle wait time.</p><br/>{0}<p>When ready, press Accept.</p>{1}</html>
CameraSolutions.ExtendedDescription.AdaptiveSettling.CautionCamera=<p><strong color="red">CAUTION</strong>: The camera {0} will move over the primary fiducial and then perform a camera settling test pattern.</p><br/>
CameraSolutions.ExtendedDescription.AdaptiveSettling.CautionMovable=<p><strong color="red">CAUTION</strong>: The {0} {1} will move to the camera {2} and then perform a camera settling test pattern.</p><br/>
CameraSolutions.ExtendedDescription.AdaptiveSettling.Results=<br/><h4>Results</h4><table><tr><td>Selected method:</td><td>{0}</td></tr><tr><td>Compute time:</td><td>{1} ms per frame</td></tr><tr><td>Settle time:</td><td>{2} ms</td></tr></table><br/>{3}<p>More information on the Camera Settling tab of camera {4}.</p>
CameraSolutions.ExtendedDescription.AdaptiveSettling.LargeSettleTime=<p>The settle time is rather large, perhaps due to excessive machine vibration. Try setting stricter X/Y axes acceleration or jerk limits (if supported).</p><br/>
CameraSolutions.Issue.CapturePropertyAuto=The {0} of camera {1} should not be set to Auto.
CameraSolutions.Solution.CapturePropertyAuto=Computer vision can only be robust and repeatable if the effect of {0} is stable. Switch off the Auto {0} and {1}.
CameraSolutions.Solution.CapturePropertyAuto.Exposure=set to a static exposure value that will be calibrated with this solution. The camera should look at a representative, rather bright subject when you press Accept
CameraSolutions.Solution.CapturePropertyValue.Revert=revert to the default setting
CameraSolutions.Solution.CapturePropertyValue.Min=set to the minimum
CameraSolutions.Solution.CapturePropertyValue.WhiteBalance=revert to the default setting. Issues & Solutions will propose calibrating static white balance instead
CameraSolutions.Issue.CapturePropertyValue=The {0} of camera {1} should be set to {2}.
CameraSolutions.Solution.CapturePropertyValue=Computer vision works best with raw information from the camera sensor, even if the images look less appealing to humans. {0}{1}.
CameraSolutions.Solution.CapturePropertyValue.SwitchOffAuto=Switch off the Auto {0} and 
CameraSolutions.Solution.CapturePropertyValue.Therefore=Therefore, 
CameraSolutions.Issue.WhiteBalance=Calibrate static white balance for camera {0}.
CameraSolutions.Solution.WhiteBalance=For best results with color-keyed computer vision, it is recommended to use static white balance.
CameraSolutions.ExtendedDescription.WhiteBalance=<html>{0}<p>Color-keyed computer vision needs stable, and accurate colors. Neither the unstable Auto white balance, nor the device manual white balance is suitable (typically merely a red-blue-shift).Therefore OpenPnP offers its own elaborate and static white balance. You can automatically calibrate it now.</p><br/><p>Make sure a suitable white balance calibration object is visible in the camera view. Brushed metal and paper are recommended. The camera should see all brightness levels, i.e., an assortment of metal objects with holes, bevels, shadows etc. usually provides good gradients.Conversely, make sure there are no colored objects visible. Lighting conditions must be as in operation.<p><br/><p>Alternatively, you can perform white balance on camera {1}'s <strong>White Balance</strong> tab.</p><br><p>Press the blue info button (below) for more information.</p><br><p>When ready, press Accept.</p></html>
CameraSolutions.ExtendedDescription.WhiteBalance.Warning=<p><strong color="red">WARNING:</strong> make sure the device properties are set as recommended by Issues & Solutions. Press <strong>Find Issues & Solutions</strong> to check for the latest status. Proceed only when you are sure the properties are OK, white balance must be computed as the last step.</p><br/>
CameraSolutions.Qualifier.CameraLight=camera light
CameraSolutions.Qualifier.CameraSwitcher=camera switcher
# CalibrationSolutions
CalibrationSolutions.Issue.BacklashCalibration=Calibrate backlash compensation for axis {0}.
CalibrationSolutions.Solution.BacklashCalibration=Automatically calibrates the backlash compensation for {0} using the primary calibration fiducial.
CalibrationSolutions.ExtendedDescription.BacklashCalibration=<html><p>Backlash compensation is used to avoid the effects of any looseness or play in the mechanical linkages of machine axes. More information can be found in the Wiki (press the blue Info button below).</p><br/><p>Set the acceptable <strong>Tolerance ±</strong> as high as possible to allow for a more efficient backlash compensation method, avoiding extra moves and direction changes.</p><br/><p><strong color="red">CAUTION 1</strong>: The camera {0} will move over the primary fiducial and then perform a calibration motion pattern, moving the axis {1} over its full soft-limit range.</p><br/><p><strong color="red">CAUTION 2</strong>: The machine will also perform a visual homing cycle, once the new backlash compensation method is established. This is done to recalibrate the coordinate system that might be affected by the new method.</p><br/><p>When ready, press Accept.</p>{2}</html>
CalibrationSolutions.ExtendedDescription.BacklashCalibration.Results=<br/><h4>Results:</h4><table><tr><td align="right">Detected Backlash:</td><td>{0}</td></tr><tr><td align="right">Selected Method:</td><td>{1}</td></tr><tr><td align="right">Sneak-up Distance:</td><td>{2}</td></tr><tr><td align="right">Speed Factor:</td><td>{3}</td></tr><tr><td align="right">Applicable Resolution:</td><td>{4} mm</td></tr></table>
CalibrationSolutions.Property.Tolerance=Tolerance ±
CalibrationSolutions.Property.ToleranceDescription=Set the targe tolerance. By granting a larger tolerance, a more efficient backlash compensation method may be eligible.
CalibrationSolutions.Exception.PrimaryXYRequired=The head {0} primary fiducial location X and Y must be set first.
CalibrationSolutions.Exception.PrimaryZRequired=The head {0} primary fiducial location Z must be set first.
CalibrationSolutions.Exception.NozzleOffsetsRequired=The nozzle {0} head offsets must be roughly set first. Use the "Noozle {0} offset for the primary fiducial" calibration.
CalibrationSolutions.Issue.AdvancedCameraCalibration=Advanced camera {0} calibration.
CalibrationSolutions.Solution.AdvancedCameraCalibration.Down=Automatically calibrates the camera {0} using the primary and secondary calibration fiducials.
CalibrationSolutions.Solution.AdvancedCameraCalibration.Up=Automatically calibrates the camera {0} using the nozzle {1}.
CalibrationSolutions.ExtendedDescription.AdvancedCameraCalibration.Down=<html><p>You already performed the preliminary camera calibration earlier, now it is time for the <strong>Advanced Camera Calibration</strong> that includes compensating lens distortion and camera mounting tilt. A more profound and precise 3D Units per Pixel calibration is also applied.</p><br/><p>More information can be found in the Wiki (press the blue Info button below).</p><br/><p>The calibration must be performed with the same calibration rig, that you used for the preliminary calibration. Make sure it is ready, and locations (including Z) are still valid.</p><br/><p>If not, please revisit the <strong>Primary calibration fiducial position</strong> and <strong>Secondary calibration fiducial position</strong> steps first (Enable the <strong>Include Solved?</strong> checkbox above, to see revisitable solutions).</p><br/><p><strong color="red">CAUTION</strong>: The camera {0} will move over the calibration rig and perform a length calibration motion pattern.</p><br/></html>
CalibrationSolutions.ExtendedDescription.AdvancedCameraCalibration.Up=<html><p>You already performed the preliminary camera calibration earlier, now it is time for the <strong>Advanced Camera Calibration</strong> that includes compensating lens distortion and camera mounting tilt. A more profound and precise 3D Units per Pixel calibration is also applied.</p><br/><p>More information can be found in the Wiki (press the blue Info button below).</p><br/><p>The calibration must be performed with the same nozzle tip, that you used for the preliminary calibration. Make sure it is loaded and its <strong>Vision Diameter</strong> is still valid. Furthermore the camera {0} position (including Z) must still be valid.</p><br/><p>If not, please revisit the <strong>Determine up-looking camera {0} position</strong> step first (Enable the <strong>Include Solved?</strong> checkbox above, to see revisitable solutions).</p><br/><p><strong color="red">CAUTION</strong>: The nozzle {1} will perform a lengthy calibration motion pattern all over the view area of the camera {0}. Before pressing <strong>Accept</strong>, you need to be sure nozzle {1} will not collide with anything!</p><br/></html>
CalibrationSolutions.Issue.NozzleOffsetCalibration=Calibrate precise camera ↔ nozzle {0} offsets.
CalibrationSolutions.Solution.NozzleOffsetCalibration=Use a test object to perform the precision camera ↔ nozzle {0} offsets calibration.
CalibrationSolutions.ExtendedDescription.NozzleOffsetCalibration=<html><p>To calibrate precision camera ↔ nozzle offsets, we let the nozzle pick, rotate and place a small test object and then measure the resulting offsets using the camera.</p><br/><p>Instructions about suitable test objects etc. must be obtained in the OpenPnP Wiki. Press the blue Info button (below) to open the Wiki.</p><br/><p>Place the calibration test object onto the calibration primary fiducial.</p><br/><p>Jog camera {0} over the test object. Target it with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the test object contour. Zoom the camera using the scroll-wheel.</p><br/><p><strong color="red">CAUTION</strong> The nozzle {1} will move to the test object and perform the calibration pick & place pattern. Make sure to load the right nozzle tip and ready the vacuum system.</p><br/><p>When ready, press Accept.</p>{2}</html>
CalibrationSolutions.Exception.SoftLimitsRequired=Axis {0} must have soft limits enabled for backlash calibration.
CalibrationSolutions.Exception.PrimaryFiducialRequired=Head {0} primary fiducial location must be set for backlash calibration.
CalibrationSolutions.Exception.PrimaryFiducialDiameterRequired=Head {0} primary fiducial diameter must be set for backlash calibration.
CalibrationSolutions.Exception.SpeedFactorIneffective=Speed factor control seems not to be effective: Should move at {0}%, but moved at {1}%. Check your driver motion control and axis configuration (must use acceleration control).
CalibrationSolutions.Exception.LargeAbsoluteError=Large absolute error detected: measured {0}{2}, but should be {1}{2}. Please check camera Units per Pixel and primary calibration fiducial Z. Revisit Issues & Solutions primary calibration fiducial and camera calibration step, if needed.
CalibrationSolutions.Exception.AxisOvershoot=Axis {0} seems to overshoot, even at the lowest speed factor. Make sure OpenPnP has effective acceleration/jerk control. Automatic compensation not possible.
CalibrationSolutions.Exception.MachineNotHomed=Machine is not enabled and homed.
CalibrationSolutions.Exception.NozzleTipNotLoaded=Nozzle {0} does not have a nozzle tip loaded.
