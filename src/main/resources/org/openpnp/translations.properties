FiducialVisionSettingsConfigurationWizard.lblParallaxDiameter.toolTipText=<html>\n<p>\nWhen the <strong>Parallax Diameter</strong> is given, the Fiduial Locator will perform its detection from two<br/>\nparallax camera view-points on both sides of the expected location of the fiducial. The distance<br/> between the two is set by the Parallax Diameter.</p>\n<p>\nThe typical application is with highly reflective fiducials, such as on HASL (Hot Air Solder Leveling)<br/>\nsurface finished PCBs. These will reflect the camera peeking through the diffuser, therefore,<br/> \nthe fiducial might appear (partially) dark and/or not well-formed for dectection.\n</p>\n<p>\nBy detecting from a parallax view-point, the fiducial appears at an angle and will reflect the<br/>\nbright diffuser of the camera light. Doing this from opposite, symmetrical viewpoints, the<br/>\nmid-point can be taken to cancel-out any parallax errors.\n</p>\n</html>
