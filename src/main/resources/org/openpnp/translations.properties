ReferenceNozzleTipCalibrationWizard.CalibrationPanel.CalibrationZOffsetLabel.toolTipText=<html>\n<p>\nWhen the vision-detected feature of a nozzle is higher up on the nozzle tip <br />\nit is recommended to shift the focus plane with the "Z Offset".\n</p>\n<p>If a nozzle tip is named "unloaded" it is used as a stand-in for calibration<br />\nof the bare nozzle tip holder. Again the "Z Offset" can be used to calibrate at the <br />\nproper focal plane. \n</p>\n</html>
ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxDiameter.toolTipText=<html>\n<p>\nWhen the <strong>Parallax Diameter</strong> is given, the sprocket hole vision will perform its detection from a<br/>\nparallax camera view-point on the side of the expected location of the sprocket hole. The distance<br/> from camera to hole is half the Parallax Diameter.</p>\n<p>\nThe typical application is with transparent tap which is difficult to see with direct vision, but its<br>\nreflective surface will reflect the bright diffuser of the camera light.</p>\n</html>
