ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.Resolution.text=Resolution
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.ResolutionLabel.text=Resolution [Driver Units]
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.ResolutionLabel.toolTipText=<html><strong>Resolution</strong> of this axis. Coordinates will be rounded to the nearest multiple when it comes<br/>\r\nto comparing them, i.e. a move is only executed, if they differ after being rounded.<br/>\r\nIdeally, this is set to the micro-step (or similar) physical resolution of the axis, or a practicle  integral<br/>\r\nmultiple thereof. The <strong>Resolution</strong> is the reciprocal of the <strong>Steps / Unit</strong>, that is often configured<br/>\r\nin controllers.<br/>\r\n<br/>\r\nFor the GcodeDriver, make sure the resolution can be expressed with the format in the <br/>\r\n<code>MOVE_TO_COMMAND</code>. Default is 0.0001 which corresponds to the %.4f (four fractional digits)<br/>\r\nformat in the <code>MOVE_TO_COMMAND</code>.<br/>\r\n<br/>\r\nNote, the <strong>Resolution</strong> is given in Driver (not System) units.\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.Steps.text=Steps
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.text=Steps / Unit
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.toolTipText=<html><strong>Steps per Unit</strong> are the reciprocal of the <strong>Resolution</strong>.<br/>\r\nThese are often found in the controller configuration, therefore you can enter them here to<br/>\r\nautomatically calculate the <strong>Resolution</strong>.</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.text=Switch Linear ↔ Rotational?
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.toolTipText=<html>It is important that OpenPnP understands whether an Axis is linear or rotational in <br/>\r\nthe controller. <br/>\r\n<br/>\r\nMost of the times this is already determined by the Axis Type, i.e. X, Y, Z are linear <br/>\r\nand Rotation is rotational. But sometimes you may run out of proper axes on the <br/>\r\ncontroller and then have to use a linear controller axis for a rotational OpenPnP axis <br/>\r\nor vice versa.<br/>\r\n<br/>\r\nIf you cannot configure your controller to switch this meaning, it is important to enable <br/>\r\nthe Switch Linear ↔ Rotational checkbox.<br/>\r\n<br/>\r\nThis is relevant in computing proper limits for feed-rate, acceleration and jerk in mixed<br/>\r\naxes moves, as only the motion of linear axes is taken into consideration for the limts in <br/>\r\nstandard G-Code.<br/>\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.text=Wrap Around
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.toolTipText=<html>Always rotate the axis the shorter way around. E.g. if it is at 270° and is commanded <br/>\r\nto go to 0° it will instead go to 360°.<br/>\r\nIf this is combined with Limit to ±180°, the axis is reset to its wrap-around coordinate <br/>\r\nusing a driver Global Offset command. With the GcodeDriver you must configure the<br/> <code>SET_GLOBAL_OFFSETS_COMMAND</code> or this will not work.\r\n</html>
