ReferenceHeadConfigurationWizard.LocationsPanel.WarningChangingLabel.text=<html><p>\n<strong>Important Notice</strong>\: the homing fiducial should be mounted \nand configured early in the build process, before you start capturing a large number of\nlocations for the Machine Setup (nozzle tip changer, feeders etc.) \n</p>\n<p style\="color\:red">Each time the above settings are changed or the fiducial physically moved, all the already captured locations in the Machine Setup will be broken. </p></html>
